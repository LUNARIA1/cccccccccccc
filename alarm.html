<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP3 반복 알림 카운터</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0b63f6;
      --danger: #d92d20;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: radial-gradient(circle at 20% 20%, #eaf1ff, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.07);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }

    p.desc {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .row {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .row.inline {
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .row.inline label {
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="number"],
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 1rem;
      background: #fff;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button#startAllBtn {
      background: #111827;
      color: #fff;
    }

    button#startBtn {
      background: var(--primary);
      color: #fff;
    }

    button#stopBtn {
      background: var(--danger);
      color: #fff;
    }

    .status {
      margin-top: 14px;
      border-top: 1px dashed var(--border);
      padding-top: 14px;
      color: var(--muted);
      min-height: 2em;
      line-height: 1.5;
    }

    .status strong {
      color: var(--text);
    }

    .divider {
      margin: 18px 0;
      border: 0;
      border-top: 1px solid var(--border);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .slot-list {
      display: grid;
      gap: 10px;
    }

    .slot {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fbfcff;
      display: grid;
      gap: 10px;
    }

    .slot-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .slot-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .slot button {
      padding: 8px 12px;
      font-size: 0.92rem;
    }

    .slot-status {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .add-slot-btn {
      background: var(--primary);
      color: #fff;
    }

    @media (max-width: 640px) {
      .row.inline {
        grid-template-columns: 1fr;
      }

      .slot-top {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>MP3 반복 알림 카운터</h1>
    <p class="desc">설정된 초를 기다렸다가 MP3를 재생하고, 반복 사용 시 지정한 초 후 다시 카운트합니다.</p>

    <div class="row">
      <label for="mp3File"><strong>1) MP3 파일 업로드 (선택)</strong></label>
      <input id="mp3File" type="file" accept="audio/mpeg,.mp3" />
    </div>

    <div class="row inline">
      <label for="xSeconds"><strong>2) 알림 대기</strong></label>
      <input id="xSeconds" type="number" min="1" step="1" value="90" />
      <label for="xSeconds">초 후에 알림(재생)</label>
    </div>

    <div class="row inline">
      <label class="checkbox" for="repeatEnabled">
        <input id="repeatEnabled" type="checkbox" checked />
        <span><strong>3) 반복 사용</strong></span>
      </label>
      <input id="ySeconds" type="number" min="1" step="1" value="7" />
      <label for="ySeconds">초 후에 리셋 후 다시 카운트</label>
    </div>

    <div class="buttons">
      <button id="startAllBtn" type="button">전체 시작</button>
      <button id="startBtn" type="button">카운트 시작</button>
      <button id="stopBtn" type="button">중지</button>
    </div>

    <div id="status" class="status">대기 중</div>

    <hr class="divider" />

    <div class="slot-header">
      <strong>추가 알람 슬롯 (분 단위, 기존 타이머와 별도)</strong>
      <button id="addSlotBtn" type="button" class="add-slot-btn">+ 슬롯 추가</button>
    </div>
    <div id="slotList" class="slot-list"></div>
  </main>

  <script>
    const mp3File = document.getElementById("mp3File");
    const xSeconds = document.getElementById("xSeconds");
    const ySeconds = document.getElementById("ySeconds");
    const repeatEnabled = document.getElementById("repeatEnabled");
    const startAllBtn = document.getElementById("startAllBtn");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");

    const addSlotBtn = document.getElementById("addSlotBtn");
    const slotList = document.getElementById("slotList");

    let audio = new Audio("chicken.mp3");
    audio.loop = true;

    let objectUrl = "";
    let running = false;
    let timerId = null;

    let slotSeq = 0;
    const slotStates = new Map();

    function setStatus(text) {
      statusEl.innerHTML = `<strong>상태:</strong> ${text}`;
    }

    function clearTimer() {
      if (timerId !== null) {
        clearTimeout(timerId);
        timerId = null;
      }
    }

    function stopAudio() {
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
    }

    function stopAll(manual = false) {
      running = false;
      clearTimer();
      stopAudio();
      if (manual) setStatus("중지됨");
    }

    function validateInputs() {
      const x = Number(xSeconds.value);
      if (!Number.isFinite(x) || x <= 0) {
        alert("x초는 1 이상의 숫자로 입력해주세요.");
        return false;
      }

      if (repeatEnabled.checked) {
        const y = Number(ySeconds.value);
        if (!Number.isFinite(y) || y <= 0) {
          alert("반복을 사용할 때 y초는 1 이상의 숫자로 입력해주세요.");
          return false;
        }
      }

      return true;
    }

    function scheduleAlarmCycle() {
      if (!running) return;

      const x = Number(xSeconds.value);
      setStatus(`${x}초 카운트 중...`);

      timerId = setTimeout(() => {
        if (!running) return;

        audio.currentTime = 0;
        audio.play().catch(() => {
          setStatus("재생 실패: 브라우저 정책으로 차단되었을 수 있습니다.");
        });
        setStatus("알림 재생 중");

        if (!repeatEnabled.checked) {
          running = false;
          setStatus("1회 재생 완료 (반복 꺼짐)");
          return;
        }

        const y = Number(ySeconds.value);
        timerId = setTimeout(() => {
          if (!running) return;
          stopAudio();
          setStatus(`${y}초 경과: 리셋 후 다시 시작`);
          scheduleAlarmCycle();
        }, y * 1000);
      }, x * 1000);
    }

    function formatRemain(totalSeconds) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function clearSlotTimers(state) {
      if (state.timeoutId !== null) {
        clearTimeout(state.timeoutId);
        state.timeoutId = null;
      }
      if (state.intervalId !== null) {
        clearInterval(state.intervalId);
        state.intervalId = null;
      }
    }

    function stopSlot(state) {
      clearSlotTimers(state);
      if (state.audio) {
        state.audio.pause();
        state.audio.currentTime = 0;
      }
    }

    function updateSlotStatus(slotEl, text) {
      const status = slotEl.querySelector('[data-role="status"]');
      if (status) status.textContent = text;
    }

    function startMainCounter() {
      if (!validateInputs()) return false;
      stopAll(false);
      running = true;
      scheduleAlarmCycle();
      return true;
    }

    function startSlotCounter(slotEl, state, showAlert = true) {
      const minutesInput = slotEl.querySelector('[data-role="minutes"]');
      if (!(minutesInput instanceof HTMLInputElement)) return false;

      const minutes = Number(minutesInput.value);
      if (!Number.isFinite(minutes) || minutes < 0) {
        if (showAlert) alert("분은 0 이상의 숫자로 입력해주세요.");
        return false;
      }

      if (!state.audio) {
        if (showAlert) alert("먼저 해당 슬롯에 MP3 파일을 업로드해주세요.");
        return false;
      }

      stopSlot(state);

      const delayMs = Math.floor(minutes * 60 * 1000);
      state.endAt = Date.now() + delayMs;
      updateSlotStatus(slotEl, `카운트 시작: 남은 시간 ${formatRemain(delayMs / 1000)}`);

      state.intervalId = setInterval(() => {
        const remainSec = Math.ceil((state.endAt - Date.now()) / 1000);
        updateSlotStatus(slotEl, `카운트 중... 남은 시간 ${formatRemain(remainSec)}`);
      }, 250);

      state.timeoutId = setTimeout(() => {
        clearSlotTimers(state);
        if (!state.audio) return;
        state.audio.currentTime = 0;
        state.audio.play().then(() => {
          updateSlotStatus(slotEl, "재생 시작");
        }).catch(() => {
          updateSlotStatus(slotEl, "재생 실패: 브라우저 정책으로 차단되었을 수 있습니다.");
        });
      }, delayMs);

      return true;
    }

    function createSlot(withDefaultAudio = false) {
      const id = slotSeq++;
      const slotEl = document.createElement("div");
      slotEl.className = "slot";
      slotEl.dataset.id = String(id);
      slotEl.innerHTML = `
        <div><strong>슬롯 ${id}</strong></div>
        <div class="slot-top">
          <input type="number" min="0" step="1" value="30" data-role="minutes" placeholder="몇 분 후" />
          <input type="file" accept="audio/mpeg,.mp3" data-role="file" />
        </div>
        <div class="slot-controls">
          <button type="button" data-role="start">카운트 시작</button>
          <button type="button" data-role="stop">중지</button>
        </div>
        <div class="slot-status" data-role="status">대기 중</div>
      `;

      slotList.appendChild(slotEl);

      const state = {
        timeoutId: null,
        intervalId: null,
        audio: null,
        url: "",
        endAt: 0
      };
      slotStates.set(id, state);

      if (withDefaultAudio) {
        state.audio = new Audio("fantasia.mp3");
        state.audio.loop = false;
        updateSlotStatus(slotEl, "기본 파일: fantasia.mp3");
      }
    }

    mp3File.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      audio = new Audio(objectUrl);
      audio.loop = true;
      setStatus(`파일 선택됨: ${file.name}`);
    });

    startBtn.addEventListener("click", () => {
      startMainCounter();
    });

    startAllBtn.addEventListener("click", () => {
      startMainCounter();

      const slots = slotList.querySelectorAll(".slot");
      slots.forEach((slotEl) => {
        const id = Number(slotEl.dataset.id);
        const state = slotStates.get(id);
        if (!state) return;
        startSlotCounter(slotEl, state, false);
      });
    });

    stopBtn.addEventListener("click", () => {
      stopAll(true);
    });

    addSlotBtn.addEventListener("click", () => {
      createSlot(false);
    });

    slotList.addEventListener("change", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLInputElement)) return;
      if (target.dataset.role !== "file") return;

      const slotEl = target.closest(".slot");
      if (!slotEl) return;

      const id = Number(slotEl.dataset.id);
      const state = slotStates.get(id);
      if (!state) return;

      const file = target.files && target.files[0];
      if (!file) return;

      if (state.url) URL.revokeObjectURL(state.url);
      state.url = URL.createObjectURL(file);
      state.audio = new Audio(state.url);
      state.audio.loop = false;
      updateSlotStatus(slotEl, `파일 선택됨: ${file.name}`);
    });

    slotList.addEventListener("click", (e) => {
      const target = e.target;
      if (!(target instanceof HTMLButtonElement)) return;

      const role = target.dataset.role;
      if (role !== "start" && role !== "stop") return;

      const slotEl = target.closest(".slot");
      if (!slotEl) return;

      const id = Number(slotEl.dataset.id);
      const state = slotStates.get(id);
      if (!state) return;

      if (role === "stop") {
        stopSlot(state);
        updateSlotStatus(slotEl, "중지됨");
        return;
      }

      startSlotCounter(slotEl, state, true);
    });

    window.addEventListener("beforeunload", () => {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      slotStates.forEach((state) => {
        if (state.url) URL.revokeObjectURL(state.url);
        if (state.audio) {
          state.audio.pause();
          state.audio.currentTime = 0;
        }
      });
    });

    setStatus("기본 파일: chicken.mp3");
    createSlot(true);
  </script>
</body>
</html>
